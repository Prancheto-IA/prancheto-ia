<?xml version="1.0" encoding="UTF-8"?>
<!-- Pálpebras vetoriais alinhadas ao viewBox 1174x948 de pranchetinho-chat.png -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1174 948"
  width="100%"
  height="100%"
  fill="none"
>
  <defs>
    <!-- Recorte circular exato da esclera de cada olho para evitar vazamento sobre os óculos -->
    <clipPath id="recorte-olhos-pranchetinho">
      <circle cx="382.5" cy="542.5" r="120.5" />
      <circle cx="795.5" cy="542.5" r="120.5" />
    </clipPath>
  </defs>

  <g clip-path="url(#recorte-olhos-pranchetinho)">
    <g class="pranchetinho-palpebras-formas">
      <!-- Pálpebra esquerda -->
      <circle cx="382.5" cy="542.5" r="121" fill="#030C29" />
      <!-- Pálpebra direita -->
      <circle cx="795.5" cy="542.5" r="121" fill="#030C29" />
    </g>
  </g>
</svg>
